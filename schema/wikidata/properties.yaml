# .hydra/schema/wikidata/properties.yaml — which Wikidata property each field is: the code every claim hydra writes
# carries in the record's `_meta.wd` (hydra/schema/wdprops.py).
#
# A layer of its own, beside FollowTheMoney (ftm/) and hydra's extensions (extensions/), never inside them. It is
# applied after FtM and the extensions are loaded: each key must name a type and field of that loaded model
# (wdlayer.errors), and a key that does not is an error in this file, never a change to the model. The schema loader
# does not read this folder.
#
#   properties   `Schema.field` or a bare `field` -> "P…". `Schema.field` wins over the bare field; a field of a parent
#                type counts. A geo link's role is `GeoLink.<role>` (the roles of .hydra/rules/geo.yaml).
#   none         fields that have no Wikidata property, so "not mapped yet" and "no such property" differ.
#
# An archive's own copy of this folder replaces the one hydra ships. The archive's .hydra/rules/wikidata.yaml (the
# import map) is laid on top: a field it fills from a property takes that property's code.

