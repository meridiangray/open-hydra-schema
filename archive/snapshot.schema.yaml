$schema: https://json-schema.org/draft/2020-12/schema
$id: https://meridiangray.github.io/open-hydra-schema/archive/snapshot.schema.yaml
title: A history snapshot
description: >-
  `.hydra/history/snapshots/<id>.json`: the authored files at one moment, by SHA-256 (the files themselves are
  zlib-compressed in `objects/`). History tracks `hydra.yaml`, `wiki.yaml`, `collections/`, `.hydra/` and `universe/`,
  minus `.hydra/parsed/`, `cache/`, `history/`, `schema/ftm/` and `universe/.parsed/`. Snapshots are never rewritten;
  `restore` and `merge` add on top. The one exception is `squash`, asked for by name, which writes a snapshot with
  `squashed` set.


  Two kinds. A *step* (`auto: true`, no `kind`) is the undo journal: every writing command takes one. A *save*
  (`kind: save`) is a change a person or agent names, with `fields` describing every step since the last save; the
  steps fold under it. `signature`, when present, is a detached signature over the save's canonical JSON (keys sorted,
  no spaces, `signature` and `id` removed), made with `gpg --detach-sign --armor` or `ssh-keygen -Y sign -n hydra`.
type: object
additionalProperties: false
required: [parents, files, message, author, time]
properties:
  parents:
    description: Parent snapshot ids (two for a merge, none for the first).
    type: array
    items: {type: string}
  files:
    description: Archive-relative path to the SHA-256 of its content.
    type: object
    additionalProperties:
      type: string
      pattern: '^[0-9a-f]{64}$'
  message: {type: string}
  author: {type: string}
  auto:
    description: "`true` for a step."
    type: boolean
  time:
    description: ISO 8601, UTC.
    type: string
  kind:
    description: "`save` for a save; absent for a step."
    const: save
  squashed:
    description: How many snapshots this one replaced.
    type: integer
    minimum: 1
  fields:
    description: "What a save covers (only on `kind: save`)."
    type: object
    additionalProperties: false
    required: [message]
    properties:
      message: {type: string, minLength: 1}
      description: {type: string}
      entities:
        description: Records added, changed or removed since the last save.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, change]
          properties:
            collection: {type: string}
            path: {type: string}
            id: {type: string}
            name: {type: string}
            change: {enum: [added, changed, removed]}
      sources:
        description: Source record ids added.
        type: array
        items: {type: string}
      packages:
        description: Packages installed since the last save (name and version).
        type: array
        items: {type: [string, object]}
      author: {type: string}
  signature:
    description: A detached signature over the save's canonical JSON.
    type: object
    additionalProperties: false
    required: [method, sig]
    properties:
      method: {enum: [gpg, ssh]}
      key:
        description: The gpg key id, or the ssh key path.
        type: string
      sig:
        description: The armoured signature.
        type: string
